<!-- Article Header -->
<section class="article-header">
    <div class="container">
        <div class="article-header__content">
            <div class="breadcrumb">
                <a href="/">Forside</a>
                <span>›</span>
                <a href="/pages/facility/indblik/nyheder.html">Indblik</a>
                <span>›</span>
                <span>Artikel</span>
            </div>
            <div class="badge-inline badge-inline--dark article-header__category">{{ category }}</div>
            <h1 class="article-title">{{ articleTitle }}</h1>

            <div class="article-meta">
                <div class="meta-item">
                    <iconify-icon icon="fluent:calendar-20-filled" inline></iconify-icon>
                    <time datetime="{{ page.date | isoDate }}">{{ page.date | danishDate }}</time>
                </div>
                {%- if authorIsPerson %}
                <div class="meta-item">
                    <iconify-icon icon="fluent:person-20-filled" inline></iconify-icon>
                    {{ authorName }}
                </div>
                {%- endif %}
                <div class="meta-item">
                    <iconify-icon icon="fluent:clock-20-filled" inline></iconify-icon>
                    {{ readTime }} min læsning
                </div>
            </div>
        </div>
    </div>
</section>
